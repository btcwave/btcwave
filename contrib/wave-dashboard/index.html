<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitcoin Wave</title>
<style>
:root {
  --bg: #0a0e17;
  --surface: #111827;
  --border: #1f2937;
  --text: #e5e7eb;
  --muted: #6b7280;
  --accent: #3b82f6;
  --green: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.5;
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

header h1 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

header h1 span { color: var(--accent); }

.status-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 8px;
  background: var(--muted);
}
.status-dot.healthy { background: var(--green); box-shadow: 0 0 8px rgba(16,185,129,0.4); }
.status-dot.warning { background: var(--amber); box-shadow: 0 0 8px rgba(245,158,11,0.4); }
.status-dot.error { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.4); }

.header-status {
  display: flex;
  align-items: center;
  font-size: 14px;
  color: var(--muted);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}

.card-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  margin-bottom: 4px;
}

.card-value {
  font-size: 28px;
  font-weight: 600;
  font-family: var(--mono);
  letter-spacing: -0.02em;
}

.card-detail {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

.sync-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin-top: 8px;
  overflow: hidden;
}

.sync-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.5s ease;
}

.sync-fill.synced { background: var(--green); }

.peers-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.peers-table th {
  text-align: left;
  padding: 8px 12px;
  color: var(--muted);
  font-weight: 500;
  border-bottom: 1px solid var(--border);
}

.peers-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 12px;
}

.peers-table tr:last-child td { border-bottom: none; }

.alerts {
  margin-bottom: 24px;
}

.alert {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.alert.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); }
.alert.warning { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: var(--amber); }

.section-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text);
}

footer {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}

@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; }
  .card-value { font-size: 22px; }
  header { flex-direction: column; gap: 8px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Bitcoin <span>Wave</span></h1>
    <div class="header-status">
      <span class="status-dot" id="health-dot"></span>
      <span id="health-text">Connecting...</span>
    </div>
  </header>

  <div class="alerts" id="alerts"></div>

  <div class="grid">
    <div class="card">
      <div class="card-label">Block Height</div>
      <div class="card-value" id="block-height">—</div>
      <div class="card-detail" id="block-detail"></div>
    </div>
    <div class="card">
      <div class="card-label">Sync Progress</div>
      <div class="card-value" id="sync-pct">—</div>
      <div class="sync-bar"><div class="sync-fill" id="sync-fill"></div></div>
    </div>
    <div class="card">
      <div class="card-label">Peers</div>
      <div class="card-value" id="peer-count">—</div>
      <div class="card-detail" id="peer-detail"></div>
    </div>
    <div class="card">
      <div class="card-label">Mempool</div>
      <div class="card-value" id="mempool-size">—</div>
      <div class="card-detail" id="mempool-detail"></div>
    </div>
    <div class="card">
      <div class="card-label">Disk Free</div>
      <div class="card-value" id="disk-free">—</div>
      <div class="card-detail" id="disk-detail"></div>
    </div>
    <div class="card">
      <div class="card-label">Uptime</div>
      <div class="card-value" id="uptime">—</div>
      <div class="card-detail" id="version-detail"></div>
    </div>
  </div>

  <div class="card" id="peers-section" style="display:none">
    <div class="section-title">Connected Peers</div>
    <table class="peers-table">
      <thead>
        <tr><th>Address</th><th>Client</th><th>Type</th><th>Height</th></tr>
      </thead>
      <tbody id="peers-body"></tbody>
    </table>
  </div>

  <footer>
    <span>Bitcoin Wave Dashboard</span>
    <span id="footer-versions"></span>
  </footer>
</div>

<script>
// When served by waved, API is same origin. When served separately, override.
const API = window.WAVED_API || window.location.origin;

function fmt(n) {
  return n.toLocaleString();
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function fmtUptime(secs) {
  if (secs < 60) return secs + 's';
  if (secs < 3600) return Math.floor(secs / 60) + 'm';
  if (secs < 86400) return Math.floor(secs / 3600) + 'h ' + Math.floor((secs % 3600) / 60) + 'm';
  return Math.floor(secs / 86400) + 'd ' + Math.floor((secs % 86400) / 3600) + 'h';
}

async function fetchJSON(path) {
  const res = await fetch(API + path);
  return res.json();
}

async function updateStatus() {
  try {
    const s = await fetchJSON('/status');
    const dot = document.getElementById('health-dot');
    const text = document.getElementById('health-text');

    if (!s.running) {
      dot.className = 'status-dot error';
      text.textContent = 'Node offline';
    } else if (s.errors && s.errors.length) {
      dot.className = 'status-dot error';
      text.textContent = 'Issues detected';
    } else if (s.warnings && s.warnings.length) {
      dot.className = 'status-dot warning';
      text.textContent = s.network + ' — warnings';
    } else {
      dot.className = 'status-dot healthy';
      text.textContent = s.network + ' — healthy';
    }

    document.getElementById('block-height').textContent = fmt(s.block_height);
    document.getElementById('block-detail').textContent =
      s.header_height > s.block_height
        ? `${fmt(s.header_height - s.block_height)} blocks behind`
        : 'At tip';

    const pct = (s.sync_progress * 100);
    document.getElementById('sync-pct').textContent = pct.toFixed(2) + '%';
    const fill = document.getElementById('sync-fill');
    fill.style.width = pct + '%';
    fill.className = pct >= 99.99 ? 'sync-fill synced' : 'sync-fill';

    document.getElementById('peer-count').textContent = s.peer_count;
    document.getElementById('peer-detail').textContent =
      `${s.connections_in || 0} in / ${s.connections_out || 0} out`;

    document.getElementById('mempool-size').textContent = fmt(s.mempool_size);
    document.getElementById('mempool-detail').textContent = fmtBytes(s.mempool_bytes || 0);

    document.getElementById('disk-free').textContent = (s.disk_free_gb || 0).toFixed(1) + ' GB';
    document.getElementById('disk-detail').textContent =
      `${(s.disk_used_gb || 0).toFixed(1)} GB used`;

    document.getElementById('uptime').textContent = fmtUptime(s.uptime_seconds || 0);
    document.getElementById('version-detail').textContent = s.version || '';

    // Alerts
    const alerts = document.getElementById('alerts');
    alerts.innerHTML = '';
    (s.errors || []).forEach(e => {
      alerts.innerHTML += `<div class="alert error">${e}</div>`;
    });
    (s.warnings || []).forEach(w => {
      alerts.innerHTML += `<div class="alert warning">${w}</div>`;
    });

  } catch (e) {
    document.getElementById('health-dot').className = 'status-dot error';
    document.getElementById('health-text').textContent = 'Cannot reach waved';
  }
}

async function updatePeers() {
  try {
    const peers = await fetchJSON('/peers');
    const section = document.getElementById('peers-section');
    const body = document.getElementById('peers-body');

    if (peers && peers.length) {
      section.style.display = 'block';
      body.innerHTML = peers.map(p => `
        <tr>
          <td>${p.addr || '—'}</td>
          <td>${p.subver || '—'}</td>
          <td>${p.connection_type || '—'}</td>
          <td>${p.synced_blocks || '—'}</td>
        </tr>
      `).join('');
    }
  } catch (e) {}
}

async function updateVersions() {
  try {
    const v = await fetchJSON('/version');
    document.getElementById('footer-versions').textContent =
      `waved ${v.waved} / ${v.node}`;
  } catch (e) {}
}

updateStatus();
updatePeers();
updateVersions();
setInterval(updateStatus, 10000);
setInterval(updatePeers, 30000);
</script>
</body>
</html>
