# Bitcoin Wave — default configuration for Pi deployments
# Agent-optimised: RPC and REST enabled, txindex on

# Network
listen=1
maxconnections=40
maxuploadtarget=5000

# RPC (localhost only — waved connects here)
server=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# REST API
rest=1

# Transaction index
txindex=1

# Memory-constrained defaults for Pi 5 (4GB)
dbcache=1024
maxmempool=100

# BIP-110 / RDTS
consensusrules=rdts
