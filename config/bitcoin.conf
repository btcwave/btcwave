# Bitcoin Wave — Node Configuration Profile
# Stock Bitcoin Knots + curated defaults for sovereignty, privacy, and spam filtering.
# This file is a TEMPLATE. The CLI generates a machine-specific version at install time.
#
# Base: Bitcoin Knots v29.3.knots20260508
# Profile version: 1.0.0

# --- Core ---
server=1
txindex=1

# --- Network (Tor by default) ---
listen=1
listenonion=1
proxy=127.0.0.1:9050
torcontrol=127.0.0.1:9051

# --- RPC ---
# rpcauth is generated per-node by the CLI. Cookie auth is the default.
# rpcauth=<user>:<salt>$<hash>
zmqpubrawblock=tcp://127.0.0.1:28332
zmqpubrawtx=tcp://127.0.0.1:28333

# RPC binding — localhost only by default. CLI adds LAN binding if requested.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# --- Resource limits (tuned for Raspberry Pi 4/5) ---
maxconnections=40
maxuploadtarget=5000

# --- Spam filtering (Knots policy defaults) ---
datacarriersize=42
permitbaremultisig=0
minrelaytxfee=0.00005
blockmaxsize=1000000
limitancestorcount=10
limitdescendantcount=20
dustrelayfee=0.00003

# --- BIP-110 / RDTS ---
# Uncomment to enforce reduced-data temporary softfork rules.
# The CLI enables this by default during guided setup.
# consensusrules=rdts
